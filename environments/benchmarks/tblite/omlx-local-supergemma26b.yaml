# OpenThoughts-TBLite Evaluation -- local oMLX (serial, supergemma4-26b)
#
# Use via scripts/run_omlx_local_eval.py so the service is restarted before
# loading this model. Reusing a live server across large models can trigger 507s.

env:
  enabled_toolsets: ["terminal", "file"]
  max_agent_turns: 25
  max_token_length: 32000
  agent_temperature: 0.8
  terminal_backend: "docker"
  terminal_timeout: 300
  tool_pool_size: 16
  dataset_name: "NousResearch/openthoughts-tblite"
  test_timeout: 600
  task_timeout: 900
  eval_concurrency: 1
  max_concurrent_tasks: 1
  tokenizer_name: "/Volumes/SPEED/Models/Olmx/models/supergemma4-26b-abliterated-multimodal-mlx-4bit"
  use_wandb: false
  wandb_name: "openthoughts-tblite-omlx-local-supergemma26b"
  ensure_scores_are_not_same: false
  data_dir_to_save_evals: "environments/benchmarks/evals/openthoughts-tblite-omlx-local-supergemma26b"

openai:
  base_url: "http://127.0.0.1:18000/v1"
  model_name: "supergemma4-26b-abliterated-multimodal-mlx-4bit"
  server_type: "openai"
  health_check: false
